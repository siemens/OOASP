[project]
name = "asp_interactive_configuration"
version = "1.0.0"
description = "project to develop an interactive asp-based configuration approach"
authors = [{ name = "gschennersie" }]
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "graphviz>=0.20,<0.21",
    "pytest>=9.0.3,<10.0.0",
    "clingraph>=1.0.0",
    "Clorm>=1.4.0,<2",
    "clinguin>=2.7.5,<3",
    "fastapi[standard]>=0.162.0,<0.163",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "autopep8>=2.0.4,<3",
    "pre-commit>=3.7.1,<4",
]

[[tool.uv.index]]
name = "test"
url = "https://test.pypi.org/simple/"

[tool.uv.build-backend]
module-name = ["ooasp"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.autopep8]
max_line_length = 120
ignore = []
in-place = true
recursive = true
agressive = 2
